services:
  davidmottet:
    build: .
    image: davidmottet-web:latest
    restart: unless-stopped

    # Traefik v3 ingress (matches the server's existing convention:
    # docker provider, traefik-net network, websecure + myresolver/Let's Encrypt,
    # global HTTP→HTTPS redirect via the redirect-to-https middleware).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.davidmottet.rule=Host(`davidmottet.com`) || Host(`www.davidmottet.com`)"
      - "traefik.http.routers.davidmottet.entrypoints=websecure"
      - "traefik.http.routers.davidmottet.tls.certresolver=myresolver"
      - "traefik.http.routers.davidmottet.middlewares=redirect-to-https"
      - "traefik.http.services.davidmottet.loadbalancer.server.port=80"

    networks:
      - traefik-net

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# traefik-net is created by the Traefik stack; we just attach to it.
networks:
  traefik-net:
    external: true
