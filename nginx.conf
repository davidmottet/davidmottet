server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    charset utf-8;

    # --- Security headers (inherited by locations below, which avoid add_header
    #     on purpose so nginx doesn't reset this inheritance) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # --- Compression ---
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml application/xml
                      application/rss+xml font/woff2;

    # --- Health endpoint (Docker HEALTHCHECK / load balancers) ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Web app manifest needs its own MIME type ---
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
    }

    # --- robots.txt & sitemap.xml: short cache, always fresh-ish ---
    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1d; }

    # --- Static, fingerprint-free assets: long cache (expires only, no
    #     add_header, so security headers keep being inherited) ---
    location ~* \.(pdf|woff2?|ttf|otf|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 30d;
    }

    # --- HTML must always revalidate so deploys show up immediately ---
    location = /index.html {
        expires -1;
    }
    location = /news/index.html {
        expires -1;
    }
    location = /news/archives/index.html {
        expires -1;
    }

    # --- News data: short cache so the daily digest shows up quickly ---
    location ^~ /news/data/ {
        expires 10m;
    }

    # --- Canonical trailing slashes ---
    location = /en            { return 301 /en/; }
    location = /news          { return 301 /news/; }
    location = /news/archives { return 301 /news/archives/; }

    # --- Real 404 for unknown paths (no SPA rewrite → avoids soft-404s) ---
    location / {
        try_files $uri $uri/ =404;
    }
}
