services:
  davidmottet:
    build: .
    image: davidmottet-web:latest
    container_name: davidmottet-web
    restart: unless-stopped

    # ── Option A — expose a port and put your existing proxy in front ──
    # Map a host port to the container; point your reverse proxy at it.
    ports:
      - "8080:80"

    # ── Option B — Traefik (uncomment + adjust to your stack) ──
    # Remove the `ports` block above if Traefik handles ingress.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.davidmottet.rule=Host(`davidmottet.com`) || Host(`www.davidmottet.com`)"
    #   - "traefik.http.routers.davidmottet.entrypoints=websecure"
    #   - "traefik.http.routers.davidmottet.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.davidmottet.loadbalancer.server.port=80"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# ── If your proxy lives on a shared external Docker network (e.g. Traefik),
#    attach this service to it instead of the default bridge: ──
# networks:
#   default:
#     external: true
#     name: proxy
